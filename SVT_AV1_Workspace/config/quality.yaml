project:
  name: "Tuning Mode Analysis for SVT-AV1"
  output_container: "ivf"

tools:
  encoder: "/home/ge63sycy/SVT-AV1/Bin/Release/SvtAv1EncApp"
  ffprobe: "ffprobe"
  ffmpeg: "ffmpeg"

encoder:
  # SVT-AV1 v4.2.0 video tuning modes.
  # IQ/tune=3 is excluded because the official v4.2.0 documentation
  # describes it as a still-image-only mode.
  tunes:
    - {name: "VQ",      value: 0}
    - {name: "PSNR",    value: 1}
    - {name: "SSIM",    value: 2}
    - {name: "MS_SSIM", value: 4}
    - {name: "VMAF",    value: 5}
  presets: [1, 10]
  crfs: [18, 26, 35, 44, 52, 60]
  lp: 0

measurement:
  memory_sample_interval_seconds: 0.10
  confidence_level: 0.95
  resume: true

profiles:
  meeting:
    selection:
      mode: "resolution_balanced"
      per_resolution_tier: 7
    tunes: ["VQ", "PSNR", "SSIM", "MS_SSIM", "VMAF"]
    presets: [1, 10]
    crfs: [18, 26, 35, 44, 52, 60]
    repetitions: 1
    warmup_runs: 0
    keep_all_bitstreams: true

  confidence:
    selection:
      mode: "prefer_1080p"
      max_videos: 1
    tunes: ["PSNR"]
    presets: [1, 10]
    crfs: [26, 35, 44]
    repetitions: 5
    warmup_runs: 1
    keep_all_bitstreams: false

  full:
    selection:
      mode: "all"
    tunes: ["VQ", "PSNR", "SSIM", "MS_SSIM", "VMAF"]
    presets: [1, 10]
    crfs: [18, 26, 35, 44, 52, 60]
    repetitions: 1
    warmup_runs: 0
    keep_all_bitstreams: true

# WP2: video quality evaluation
inputs:
  encoding_runs: "results/raw/encoding_runs_wp2_recovered.csv"

metrics:
  vmaf_model: "vmaf_v0.6.1"
  vmaf_model_4k: null
  features:
    - psnr
    - float_ssim
    - float_ms_ssim
  threads: 4
  scale_flags: bicubic
  pix_fmt: ref

bd_rate:
  baseline_tune: "VQ"
  metrics:
    - vmaf_mean
    - psnr_yuv_mean
  min_points: 3

validate:
  monotonic_tol_vmaf: 0.5

selftest:
  frames: 30
  identity:
    psnr_min: 40
    ssim_min: 0.99
    vmaf_min: 90
  noise_levels: [5, 10, 20]
  blur_sigmas: [0.5, 1.0, 2.0]
  resize_factors: [1.2, 1.5, 2.0]
  crosscheck:
    psnr_db: 0.5
    ssim_abs: 0.05
  invariance:
    psnr_db: 2.0
    vmaf: 10.0
  scale_flags:
    - bicubic
    - bilinear
    - lanczos
  scale_spread:
    vmaf: 5.0
    psnr_db: 2.0

plots:
  dpi: 150
  metrics:
    - vmaf_mean
    - psnr_yuv_mean
    - ssim_mean
